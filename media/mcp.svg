<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">From a comment to a fix, and back</title>
<desc id="desc">Someone pins a comment on an element. Your coding agent picks it up over MCP with the element's selector and text, makes the change for review, then replies and resolves. The reply shows up in the thread on the page.</desc>
<style>
  :root { --canvas: #ffffff; --dot: #d7d8dd; --frame: #dcdde2; --tile: #f1f1f3; --tile-line: #d2d3d8;
    --ink: #15161a; --label: #5c5e66; --muted: #8a8c94; --wire: #b5b7bf; --accent: #2457e6;
    --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #111216; --dot: #272930; --frame: #2a2c33; --tile: #191a20; --tile-line: #33353d;
      --ink: #ecedf0; --label: #a3a5ae; --muted: #6f717a; --wire: #4a4c55; --accent: #5a85ff; }
  }
  .bg { fill: var(--canvas); }
  .dot { fill: var(--dot); }
  .frame { fill: none; stroke: var(--frame); }
  .grp { fill: none; stroke: var(--tile-line); }
  .grp.dash { stroke-dasharray: 5 5; }
  .grp.accent { stroke: var(--accent); stroke-opacity: 0.55; }
  .tile { fill: var(--tile); stroke: var(--tile-line); }
  .tile.sel { stroke: var(--accent); stroke-width: 1.5; }
  .tile.on { fill: var(--accent); stroke: var(--accent); }
  .node.off { opacity: 0.5; }
  .node.off .tile { stroke-dasharray: 4 4; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .node.on .ico { stroke: var(--on-accent); }
  .wire { fill: none; stroke: var(--wire); stroke-width: 1.3; stroke-dasharray: 4 4; }
  .wire.live { stroke: var(--accent); stroke-opacity: 0.45; }
  .wire.off { opacity: 0.55; }
  .pulse { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
  .t { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    paint-order: stroke; stroke: var(--canvas); stroke-width: 7px; stroke-linejoin: round; }
  .t-lab { font-size: 13px; letter-spacing: 0.08em; fill: var(--label); }
  .t-sub { font-size: 12px; fill: var(--accent); }
  .node.off .t-sub { fill: var(--muted); }
  .t-grp { font-size: 13px; letter-spacing: 0.08em; fill: var(--ink); }
  .t-grp.accent { fill: var(--accent); }
  .t-edge { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
  .t-note { font-size: 12px; letter-spacing: 0.06em; fill: var(--label); }
  .t-title { font-size: 15px; letter-spacing: 0.04em; fill: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .pulse { display: none; } .wire.live { stroke-opacity: 0.8; } }
  @keyframes p0 { 0%, 0.000% { stroke-dashoffset: 34; } 6.470%, 100% { stroke-dashoffset: -102.0; } }
  .p0 { stroke-dasharray: 34 170.0; stroke-dashoffset: 34; animation: p0 5005ms linear infinite; }
  @keyframes p1 { 0%, 4.853% { stroke-dashoffset: 34; } 11.323%, 100% { stroke-dashoffset: -102.0; } }
  .p1 { stroke-dasharray: 34 170.0; stroke-dashoffset: 34; animation: p1 5005ms linear infinite; }
  @keyframes p2 { 0%, 9.705% { stroke-dashoffset: 34; } 16.651%, 100% { stroke-dashoffset: -112.0; } }
  .p2 { stroke-dasharray: 34 180.0; stroke-dashoffset: 34; animation: p2 5005ms linear infinite; }
  @keyframes p3 { 0%, 15.033% { stroke-dashoffset: 34; } 21.979%, 100% { stroke-dashoffset: -112.0; } }
  .p3 { stroke-dasharray: 34 180.0; stroke-dashoffset: 34; animation: p3 5005ms linear infinite; }
  @keyframes p4 { 0%, 20.362% { stroke-dashoffset: 34; } 26.832%, 100% { stroke-dashoffset: -102.0; } }
  .p4 { stroke-dasharray: 34 170.0; stroke-dashoffset: 34; animation: p4 5005ms linear infinite; }
  @keyframes p5 { 0%, 25.214% { stroke-dashoffset: 34; } 32.160%, 100% { stroke-dashoffset: -112.0; } }
  .p5 { stroke-dasharray: 34 180.0; stroke-dashoffset: 34; animation: p5 5005ms linear infinite; }
  @keyframes p6 { 0%, 30.542% { stroke-dashoffset: 34; } 83.635%, 100% { stroke-dashoffset: -1082.0; } }
  .p6 { stroke-dasharray: 34 1150.0; stroke-dashoffset: 34; animation: p6 5005ms linear infinite; }
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="dot" cx="11" cy="11" r="1.1"/></pattern></defs>
<rect class="bg" x="0" y="0" width="1200" height="500"/>
<rect x="0" y="0" width="1200" height="500" fill="url(#dots)"/>
<path class="wire live" d="M144 200 L246 200"/>
<path class="wire live" d="M334 200 L436 200"/>
<path class="wire live" d="M524 200 L636 200"/>
<path class="wire live" d="M724 200 L836 200"/>
<path class="wire live" d="M924 200 L1026 200"/>
<path class="wire live" d="M1070 244 L1070 356"/>
<path class="wire live" d="M1026 400 L100 400 L100 244"/>
<text x="560" y="390" class="t t-edge" text-anchor="middle">THEY SEE THE REPLY</text>
<path class="pulse p0" d="M144 200 L246 200"/><path class="pulse p1" d="M334 200 L436 200"/><path class="pulse p2" d="M524 200 L636 200"/><path class="pulse p3" d="M724 200 L836 200"/><path class="pulse p4" d="M924 200 L1026 200"/><path class="pulse p5" d="M1070 244 L1070 356"/><path class="pulse p6" d="M1026 400 L100 400 L100 244"/>
<g class="node">
<rect class="tile" x="56" y="156" width="88" height="88" rx="2"/>
<g transform="translate(82.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8z M4.5 20.5a7.5 7.5 0 0 1 15 0"/></g>
<text x="100" y="268" class="t t-lab" text-anchor="middle">REVIEWER</text>

</g>
<g class="node">
<rect class="tile" x="246" y="156" width="88" height="88" rx="2"/>
<g transform="translate(272.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z M12 8a2 2 0 1 0 0 4a2 2 0 0 0 0-4z"/></g>
<text x="290" y="268" class="t t-lab" text-anchor="middle">COMMENT</text>
<text x="290" y="286" class="t t-sub" text-anchor="middle">on the element</text>
</g>
<g class="node sel">
<rect class="tile sel" x="436" y="156" width="88" height="88" rx="2"/>
<g transform="translate(462.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M8 8l-4 4l4 4 M16 8l4 4l-4 4 M13.5 6l-3 12"/></g>
<text x="480" y="268" class="t t-lab" text-anchor="middle">DOGEAR</text>
<text x="480" y="286" class="t t-sub" text-anchor="middle">thread + selector</text>
</g>
<g class="node on">
<rect class="tile on" x="636" y="156" width="88" height="88" rx="2"/>
<g transform="translate(662.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M4 5h16v14H4z M7.5 9.5L10 12l-2.5 2.5 M12 15h4"/></g>
<text x="680" y="268" class="t t-lab" text-anchor="middle">CODING AGENT</text>
<text x="680" y="286" class="t t-sub" text-anchor="middle">dogear_next</text>
</g>
<g class="node">
<rect class="tile" x="836" y="156" width="88" height="88" rx="2"/>
<g transform="translate(862.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M6 3a2 2 0 1 0 0 4a2 2 0 0 0 0-4z M6 17a2 2 0 1 0 0 4a2 2 0 0 0 0-4z M18 7a2 2 0 1 0 0 4a2 2 0 0 0 0-4z M6 7v10 M18 11c0 4-6 3.5-11 6.5"/></g>
<text x="880" y="268" class="t t-lab" text-anchor="middle">CHANGE</text>
<text x="880" y="286" class="t t-sub" text-anchor="middle">for review</text>
</g>
<g class="node">
<rect class="tile" x="1026" y="156" width="88" height="88" rx="2"/>
<g transform="translate(1052.6 182.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M5 12.5l4.5 4.5L19 7.5"/></g>
<text x="1070" y="268" class="t t-lab" text-anchor="middle">REPLY + RESOLVE</text>
<text x="1070" y="286" class="t t-sub" text-anchor="middle">dogear_resolve</text>
</g>
<g class="node">
<rect class="tile" x="1026" y="356" width="88" height="88" rx="2"/>
<g transform="translate(1052.6 382.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1-3.6A8 8 0 0 1 4 12z M8.6 12h.01 M12 12h.01 M15.4 12h.01"/></g>
<text x="1070" y="468" class="t t-lab" text-anchor="middle">IN THE THREAD</text>
<text x="1070" y="486" class="t t-sub" text-anchor="middle">on the page</text>
</g>
<rect class="frame" x="0.5" y="0.5" width="1199" height="499"/>
</svg>
