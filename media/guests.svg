<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">Nobody has to sign in</title>
<desc id="desc">With guests on, a visitor gives a name the first time and comments. The server signs a cookie, so the author never comes from the browser. Mentions and alerts stay off until you add your own sign-in.</desc>
<style>
  :root { --canvas: #ffffff; --dot: #d7d8dd; --frame: #dcdde2; --tile: #f1f1f3; --tile-line: #d2d3d8;
    --ink: #15161a; --label: #5c5e66; --muted: #8a8c94; --wire: #b5b7bf; --accent: #2457e6;
    --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #111216; --dot: #272930; --frame: #2a2c33; --tile: #191a20; --tile-line: #33353d;
      --ink: #ecedf0; --label: #a3a5ae; --muted: #6f717a; --wire: #4a4c55; --accent: #5a85ff; }
  }
  .bg { fill: var(--canvas); }
  .dot { fill: var(--dot); }
  .frame { fill: none; stroke: var(--frame); }
  .grp { fill: none; stroke: var(--tile-line); }
  .grp.dash { stroke-dasharray: 5 5; }
  .grp.accent { stroke: var(--accent); stroke-opacity: 0.55; }
  .tile { fill: var(--tile); stroke: var(--tile-line); }
  .tile.sel { stroke: var(--accent); stroke-width: 1.5; }
  .tile.on { fill: var(--accent); stroke: var(--accent); }
  .node.off { opacity: 0.5; }
  .node.off .tile { stroke-dasharray: 4 4; }
  .ico { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .node.on .ico { stroke: var(--on-accent); }
  .wire { fill: none; stroke: var(--wire); stroke-width: 1.3; stroke-dasharray: 4 4; }
  .wire.live { stroke: var(--accent); stroke-opacity: 0.45; }
  .wire.off { opacity: 0.55; }
  .pulse { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
  .t { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    paint-order: stroke; stroke: var(--canvas); stroke-width: 7px; stroke-linejoin: round; }
  .t-lab { font-size: 13px; letter-spacing: 0.08em; fill: var(--label); }
  .t-sub { font-size: 12px; fill: var(--accent); }
  .node.off .t-sub { fill: var(--muted); }
  .t-grp { font-size: 13px; letter-spacing: 0.08em; fill: var(--ink); }
  .t-grp.accent { fill: var(--accent); }
  .t-edge { font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); }
  .t-note { font-size: 12px; letter-spacing: 0.06em; fill: var(--label); }
  .t-title { font-size: 15px; letter-spacing: 0.04em; fill: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .pulse { display: none; } .wire.live { stroke-opacity: 0.8; } }
  @keyframes p0 { 0%, 0.000% { stroke-dashoffset: 34; } 16.873%, 100% { stroke-dashoffset: -102.0; } }
  .p0 { stroke-dasharray: 34 170.0; stroke-dashoffset: 34; animation: p0 1919ms linear infinite; }
  @keyframes p1 { 0%, 12.655% { stroke-dashoffset: 34; } 29.529%, 100% { stroke-dashoffset: -102.0; } }
  .p1 { stroke-dasharray: 34 170.0; stroke-dashoffset: 34; animation: p1 1919ms linear infinite; }
  @keyframes p2 { 0%, 25.310% { stroke-dashoffset: 34; } 43.424%, 100% { stroke-dashoffset: -112.0; } }
  .p2 { stroke-dasharray: 34 180.0; stroke-dashoffset: 34; animation: p2 1919ms linear infinite; }
  @keyframes p3 { 0%, 39.206% { stroke-dashoffset: 34; } 57.320%, 100% { stroke-dashoffset: -112.0; } }
  .p3 { stroke-dasharray: 34 180.0; stroke-dashoffset: 34; animation: p3 1919ms linear infinite; }
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle class="dot" cx="11" cy="11" r="1.1"/></pattern></defs>
<rect class="bg" x="0" y="0" width="1200" height="500"/>
<rect x="0" y="0" width="1200" height="500" fill="url(#dots)"/>
<rect class="grp dash accent" x="400" y="290" width="400" height="170"/>
<text x="418" y="295" class="t t-grp accent" text-anchor="start">ADD AUTH TO TURN THESE ON</text>
<path class="wire live" d="M154 170 L256 170"/>
<path class="wire live" d="M344 170 L446 170"/>
<path class="wire live" d="M534 170 L646 170"/>
<path class="wire live" d="M734 170 L846 170"/>
<path class="pulse p0" d="M154 170 L256 170"/><path class="pulse p1" d="M344 170 L446 170"/><path class="pulse p2" d="M534 170 L646 170"/><path class="pulse p3" d="M734 170 L846 170"/>
<g class="node">
<rect class="tile" x="66" y="126" width="88" height="88" rx="2"/>
<g transform="translate(92.6 152.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8z M4.5 20.5a7.5 7.5 0 0 1 15 0"/></g>
<text x="110" y="238" class="t t-lab" text-anchor="middle">VISITOR</text>
<text x="110" y="256" class="t t-sub" text-anchor="middle">no account</text>
</g>
<g class="node">
<rect class="tile" x="256" y="126" width="88" height="88" rx="2"/>
<g transform="translate(282.6 152.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M3 6h18v12H3z M8.5 9a2 2 0 1 0 0 4a2 2 0 0 0 0-4z M5.5 16c.5-1.4 1.6-2.1 3-2.1s2.5.7 3 2.1 M14 10h4 M14 13h3"/></g>
<text x="300" y="238" class="t t-lab" text-anchor="middle">NAME</text>
<text x="300" y="256" class="t t-sub" text-anchor="middle">asked once</text>
</g>
<g class="node on">
<rect class="tile on" x="446" y="126" width="88" height="88" rx="2"/>
<g transform="translate(472.6 152.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1-3.6A8 8 0 0 1 4 12z M8.6 12h.01 M12 12h.01 M15.4 12h.01"/></g>
<text x="490" y="238" class="t t-lab" text-anchor="middle">COMMENT</text>
<text x="490" y="256" class="t t-sub" text-anchor="middle">pin + thread</text>
</g>
<g class="node">
<rect class="tile" x="646" y="126" width="88" height="88" rx="2"/>
<g transform="translate(672.6 152.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M8 8l-4 4l4 4 M16 8l4 4l-4 4 M13.5 6l-3 12"/></g>
<text x="690" y="238" class="t t-lab" text-anchor="middle">ONE ROUTE</text>
<text x="690" y="256" class="t t-sub" text-anchor="middle">guests: true</text>
</g>
<g class="node sel">
<rect class="tile sel" x="846" y="126" width="88" height="88" rx="2"/>
<g transform="translate(872.6 152.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M5 4.5h14v6.5H5z M5 13h14v6.5H5z M8.5 7.75h.01 M8.5 16.25h.01 M12 7.75h4 M12 16.25h4"/></g>
<text x="890" y="238" class="t t-lab" text-anchor="middle">STORE</text>
<text x="890" y="256" class="t t-sub" text-anchor="middle">signed cookie</text>
</g>
<g class="node off">
<rect class="tile" x="466" y="326" width="88" height="88" rx="2"/>
<g transform="translate(492.6 352.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M16 12a4 4 0 1 1-8 0a4 4 0 0 1 8 0z M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/></g>
<text x="510" y="438" class="t t-lab" text-anchor="middle">MENTIONS</text>

</g>
<g class="node off">
<rect class="tile" x="646" y="326" width="88" height="88" rx="2"/>
<g transform="translate(672.6 352.6) scale(1.45)"><path class="ico" vector-effect="non-scaling-stroke" d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20.5a2 2 0 0 0 4 0"/></g>
<text x="690" y="438" class="t t-lab" text-anchor="middle">ALERTS</text>

</g>
<rect class="frame" x="0.5" y="0.5" width="1199" height="499"/>
</svg>
